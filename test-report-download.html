<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kygo Report Download · Live Preview</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; }
    .preview-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #0F172A; color: #fff;
      padding: 6px 14px; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; }
    .preview-banner b { color: #22C55E; }
    .preview-banner button { margin-left: auto; background: #22C55E; color: #fff; border: 0; padding: 4px 12px;
      border-radius: 9999px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .preview-spacer { height: 32px; }
    body.shot .preview-banner, body.shot .preview-spacer { display: none; }
  </style>
</head>
<body>
  <div class="preview-banner">
    <span><b>LIVE PREVIEW</b> · kygo-report-download · pdf-url: <b id="pdf"></b> (?pdf=&lt;url&gt;)</span>
    <button onclick="location.href = location.pathname + '?v=' + Date.now()">Hard refresh</button>
  </div>
  <div class="preview-spacer"></div>

  <kygo-report-download></kygo-report-download>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.has('shot')) document.body.classList.add('shot');
    const el = document.querySelector('kygo-report-download');
    // Stand-in for the Wix page code: $w('CustomElement').setAttribute('pdf-url', PDF_URL)
    if (params.get('pdf')) el.setAttribute('pdf-url', params.get('pdf'));
    document.getElementById('pdf').textContent = params.get('pdf') || '(not set: button disabled)';
    window.__events = [];
    document.addEventListener('reportDownload', e => {
      window.__events.push({ type: 'reportDownload', detail: e.detail });
      console.log('[harness] reportDownload', JSON.stringify(e.detail));
    });
    const s = document.createElement('script');
    s.src = 'kygo-report-download.js?v=' + Date.now();
    document.body.appendChild(s);
  </script>
</body>
</html>
