<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kygo-blog-post CTA preview</title>
  <style>
    body { font-family: 'DM Sans', sans-serif; margin: 0; background: #fff; color: #1E293B; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 20px; }
    h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin: 32px 0 10px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>mid-article CTA</h2>
    <kygo-blog-post-inline-cta slug="how-caffeine-affects-hrv"
      hook="Caffeine hits everyone differently. Yours is one week of logging away."></kygo-blog-post-inline-cta>

    <h2>post-end CTA (sleep category)</h2>
    <kygo-blog-post-cta category="sleep" slug="deep-sleep-and-late-dinners"></kygo-blog-post-cta>
  </div>
  <script>
    document.write('<scr' + 'ipt src="kygo-blog-post.js?v=' + Date.now() + '"></scr' + 'ipt>');
  </script>
</body>
</html>
