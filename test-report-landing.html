<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kygo Report Landing · Live Preview</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fff; }
    .preview-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: #0F172A; color: #fff;
      padding: 6px 14px; display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 500; }
    .preview-banner b { color: #22C55E; }
    .preview-banner button { margin-left: auto; background: #22C55E; color: #fff; border: 0; padding: 4px 12px;
      border-radius: 9999px; font-size: 11px; font-weight: 700; cursor: pointer; }
    .preview-spacer { height: 32px; }
    body.shot .preview-banner, body.shot .preview-spacer { display: none; }
  </style>
</head>
<body>
  <div class="preview-banner">
    <span><b>LIVE PREVIEW</b> · kygo-report-landing · host mock: <b id="mode"></b> (?host=ok | fail | none)</span>
    <button onclick="location.href = location.pathname + '?v=' + Date.now()">Hard refresh</button>
  </div>
  <div class="preview-spacer"></div>

  <kygo-report-landing redirect-url="test-report-download.html"></kygo-report-landing>

  <script>
    // Stand-in for the Wix page code: answer reportSubscribe through data-form-result.
    const params = new URLSearchParams(location.search);
    const mode = params.get('host') || 'ok';
    if (params.has('shot')) document.body.classList.add('shot');
    document.getElementById('mode').textContent = mode;
    window.__events = [];
    ['reportSubscribe', 'subscribe'].forEach(n => document.addEventListener(n, e => {
      window.__events.push({ type: n, detail: e.detail });
      console.log('[harness]', n, JSON.stringify(e.detail));
    }));
    document.querySelector('kygo-report-landing').addEventListener('reportSubscribe', (e) => {
      if (mode === 'none') return; // exercises the 10 s safety timeout
      setTimeout(() => e.target.setAttribute('data-form-result',
        mode === 'fail' ? 'error:Something went wrong. Please try again.' : 'success'), 500);
    });
    const s = document.createElement('script');
    s.src = 'kygo-report-landing.js?v=' + Date.now();
    document.body.appendChild(s);
  </script>
</body>
</html>
