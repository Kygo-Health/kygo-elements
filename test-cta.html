<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kygo-cta preview</title>
  <style>
    body { font-family: 'DM Sans', sans-serif; margin: 0; background: #F8FAFC; color: #1E293B; }
    .band { padding: 40px 20px; max-width: 900px; margin: 0 auto; }
    .card { background: #0F172A; border-radius: 24px; padding: 40px 24px; }
    h2 { font-family: 'Space Grotesk', sans-serif; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: #94A3B8; margin: 32px 0 12px; }
  </style>
</head>
<body>
  <div class="band">
    <h2>light / centered (tool + faq)</h2>
    <kygo-cta slug="test-tool" surface="tool" hook="You just read what the research says. Kygo shows what your own nights say."></kygo-cta>

    <h2>light / left (home hero)</h2>
    <kygo-cta slug="home-hero" surface="home" align="left" note="Two minute setup. Free plan on web or in the app. Cancel anytime."></kygo-cta>

    <h2>dark card (blog)</h2>
    <div class="card">
      <kygo-cta theme="dark" slug="test-blog" surface="blog" hook="Articles tell you what the science says. Your own data tells you what to change tonight."></kygo-cta>
    </div>
  </div>
  <script>
    document.write('<scr' + 'ipt src="kygo-cta.js?v=' + Date.now() + '"></scr' + 'ipt>');
  </script>
  <script>
    // Log the analytics payload so the preview shows what Mixpanel would receive.
    window.mixpanel = { track: (n, p) => console.log('[mixpanel]', n, p) };
    document.addEventListener('kygo-cta-click', e => console.log('[event]', e.detail));
  </script>
</body>
</html>
