<style>#kygo-footer-root{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif}.kygo-footer{background:#1E293B;color:#94A3B8;padding:48px 24px 32px}.kygo-footer-inner{max-width:1200px;margin:0 auto}.kygo-footer-top{display:grid;grid-template-columns:1fr;gap:40px;margin-bottom:40px}@media (min-width:768px){.kygo-footer-top{grid-template-columns:1.5fr 1fr 1fr 1fr;gap:48px}}.kygo-footer-brand{display:flex;flex-direction:column;gap:16px}.kygo-footer-logo{display:flex;align-items:center;gap:10px;text-decoration:none}.kygo-footer-logo img{height:40px;width:auto}.kygo-footer-logo span{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;color:#22C55E;letter-spacing:-0.02em}.kygo-footer-socials{display:flex;gap:12px;margin-top:4px}.kygo-footer-socials a{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,0.06);color:#94A3B8;transition:all 0.2s}.kygo-footer-socials a:hover{background:rgba(34,197,94,0.15);color:#22C55E;transform:translateY(-2px)}.kygo-footer-contact{margin-top:8px}.kygo-footer-contact p{font-size:14px;line-height:1.6;color:#94A3B8;margin:0}.kygo-footer-contact a{color:#94A3B8;text-decoration:none;transition:color 0.2s}.kygo-footer-contact a:hover{color:#22C55E}.kygo-footer-column h4{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;color:#F1F5F9;text-transform:uppercase;letter-spacing:0.05em;margin:0 0 16px 0}.kygo-footer-column ul{list-style:none;margin:0;padding:0}.kygo-footer-column li{margin-bottom:10px}.kygo-footer-column a{color:#94A3B8;text-decoration:none;font-size:14px;transition:color 0.2s;display:inline-block}.kygo-footer-column a:hover{color:#22C55E}.kygo-footer-cta{background:linear-gradient(135deg,rgba(34,197,94,0.1) 0%,rgba(22,163,74,0.05) 100%);border:1px solid rgba(34,197,94,0.2);border-radius:12px;padding:20px;text-align:center}.kygo-footer-cta p{font-size:14px;color:#CBD5E1;margin:0 0 12px 0}.kygo-footer-cta-buttons{display:flex;flex-direction:column;gap:8px;align-items:center}.kygo-footer-cta-alts{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}.kygo-footer-cta-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(135deg,#22C55E 0%,#16A34A 100%);color:white !important;padding:12px 24px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;transition:all 0.25s ease;box-shadow:0 2px 8px rgba(34,197,94,0.25);line-height:1;width:100%}.kygo-footer-cta-btn svg{flex-shrink:0;vertical-align:middle;position:relative;top:-1px}.kygo-footer-cta-btn:hover{transform:translateY(-2px);box-shadow:0 4px 16px rgba(34,197,94,0.35)}.kygo-footer-cta-btn-android{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:transparent;border:1.5px solid rgba(34,197,94,0.5);color:#22C55E !important;padding:11px 14px;border-radius:8px;font-weight:600;font-size:14px;text-decoration:none;transition:all 0.25s ease;line-height:1;width:100%}.kygo-footer-cta-btn-android svg{flex-shrink:0;vertical-align:middle}.kygo-footer-cta-btn-android:hover{background:rgba(34,197,94,0.08);transform:translateY(-2px);border-color:#22C55E}.kygo-footer-divider{height:1px;background:rgba(148,163,184,0.15);margin:32px 0}.kygo-footer-bottom{display:flex;flex-direction:column;gap:16px}@media (min-width:768px){.kygo-footer-bottom{flex-direction:row;justify-content:space-between;align-items:flex-start}}.kygo-footer-legal-links{display:flex;flex-wrap:wrap;gap:8px 20px}.kygo-footer-legal-links a{color:#94A3B8;text-decoration:underline;text-underline-offset:3px;font-size:13px;transition:color 0.2s}.kygo-footer-legal-links a:hover{color:#CBD5E1}.kygo-footer-disclaimer{font-size:12px;line-height:1.7;color:#94A3B8;max-width:900px}.kygo-footer-disclaimer p{margin:0}.kygo-footer-sub{background:linear-gradient(135deg,rgba(34,197,94,0.12) 0%,rgba(22,163,74,0.05) 100%);border:1px solid rgba(34,197,94,0.22);border-radius:14px;padding:18px 16px;margin-bottom:28px}.kygo-footer-sub-inner{display:flex;flex-direction:column;gap:14px;align-items:stretch}@media (min-width:860px){.kygo-footer-sub-inner{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}}.kygo-footer-sub-copy{display:flex;flex-direction:column;gap:3px;min-width:0}.kygo-footer-sub-copy strong{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;color:#F1F5F9;line-height:1.3}.kygo-footer-sub-copy span{font-size:13.5px;color:#94A3B8;line-height:1.5}.kygo-footer-sub-form{display:flex;flex-direction:column;gap:8px;width:100%}@media (min-width:520px){.kygo-footer-sub-form{flex-direction:row}}@media (min-width:860px){.kygo-footer-sub-form{width:auto;flex:0 0 auto;min-width:380px}}.kygo-footer-sub-form input{flex:1 1 auto;min-width:0;width:100%;border:1.5px solid rgba(148,163,184,0.3);background:rgba(255,255,255,0.06);border-radius:10px;padding:13px 14px;font-family:'DM Sans',sans-serif;font-size:15px;color:#F8FAFC;outline:none;transition:border-color 0.2s,box-shadow 0.2s}.kygo-footer-sub-form input::placeholder{color:#64748B}.kygo-footer-sub-form input:focus{border-color:#22C55E;box-shadow:0 0 0 3px rgba(34,197,94,0.15)}.kygo-footer-sub-form button{flex:0 0 auto;width:100%;min-height:48px;border:none;cursor:pointer;border-radius:10px;padding:0 22px;background:linear-gradient(135deg,#22C55E 0%,#16A34A 100%);color:#fff;font-family:'DM Sans',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;transition:transform 0.2s,box-shadow 0.2s,opacity 0.2s}@media (min-width:520px){.kygo-footer-sub-form button{width:auto}}.kygo-footer-sub-form button:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(34,197,94,0.3)}.kygo-footer-sub-form button:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none}.kygo-footer-sub-trust{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:#94A3B8}.kygo-footer-sub-trust span{display:inline-flex;align-items:center;gap:5px}.kygo-footer-sub-trust
