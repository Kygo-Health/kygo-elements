<!--
  Kygo Picks card (sleep) for the Wix Blog "HTML code" block.
  Only data-slug on .card changes per placement (lowercase-dashes, max 40 chars).
  Clicks reach GA4 through kygo-tracking.js (cta_click, related_tool_click); height through the
  "Kygo Promo Card Sizing" custom embed (promo-card-bridge.html). Keep tiles in sync with kygo-picks.js.
-->
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent}
body{font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:#0f172a;line-height:1.5}
a{text-decoration:none}
.card{display:grid;gap:20px;padding:22px;border-radius:20px}
.copy{display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.kicker{font-family:'Space Grotesk',sans-serif;font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.title{font-family:'Space Grotesk',sans-serif;font-size:clamp(22px,4vw,28px);line-height:1.15;font-weight:700;letter-spacing:-.01em}
.sub{font-size:15px;line-height:1.5;max-width:40ch}
.btn{margin-top:8px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;background:#22c55e;color:#0f172a;font-size:15px;font-weight:700;transition:background .2s}
.btn:hover{background:#4ade80}
@media(min-width:600px){.card{padding:28px;gap:24px}}
@media(min-width:760px){.card{gap:28px;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:center}}
.card{background:#0f172a;color:#fff}
.kicker{color:#6ee7a0}
.title{color:#fff}
.sub{color:rgba(255,255,255,.75)}
.tiles{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:440px){.tiles{grid-template-columns:1fr 1fr}}
.tile{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#fff;color:#0f172a;transition:transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.img{flex:0 0 48px;width:48px;height:48px;border-radius:10px;overflow:hidden;background:#f1f5f9}
.img img{display:block;width:48px;height:48px;object-fit:cover}
.txt{flex:1;min-width:0;display:flex;flex-direction:column}
.lbl{font-size:12px;font-weight:600;color:#15803d}
.nm{font-family:'Space Grotesk',sans-serif;font-size:15px;line-height:1.2;font-weight:700}
.go{flex:none}
</style>

  </div>
</aside>
<script>
(function () {
  var CARD = 'picks';
  var top = window.top && window.top !== window ? window.top : null;
  var root = document.querySelector('.card');
  var slug = (root && root.getAttribute('data-slug')) || '';
  function post(msg) {
    if (!top) return;
    try { top.postMessage(msg, '*'); } catch (e) { /* no page to report to */ }
  }
  // Clicks: {kygo:'promo'}, filed in GA4 by kygo-tracking.js.
  document.addEventListener('click', function (e) {
    var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    post({ kygo: 'promo', card: CARD, type: 'click', slug: slug, label: a.getAttribute('data-label') || '', url: a.href });
  }, true);
  // Height: read by the Kygo Promo Card Sizing embed, kygo-tracking.js and the HLTH bridge.
  function reportHeight() {
    if (!root) return;
    var h = Math.ceil(root.getBoundingClientRect().bottom + (window.scrollY || 0)) + 2;
    post({ kygo: 'embed', type: 'height', height: h });
    post({ type: 'kygo-embed-height', height: h });
    post({ kygo: 'promo', card: CARD, type: 'height', slug: slug, height: h });
  }
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(reportHeight).observe(root || document.documentElement);
  window.addEventListener('load', reportHeight);
  reportHeight();
  // One impression, filed by kygo-tracking.js as GA4 cta_view (label picks-<slug>).
  if (typeof IntersectionObserver !== 'undefined' && root) {
    var io = new IntersectionObserver(function (entries) {
      if (!entries.some(function (x) { return x.isIntersecting; })) return;
      io.disconnect();
      post({ kygo: 'embed', type: 'view', slug: CARD + '-' + slug });
    }, { threshold: 0.5 });
    io.observe(root);
  }
})();
</script>
